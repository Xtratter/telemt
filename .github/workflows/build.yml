name: Build nginx with OpenSSL 3.5

on:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre3-dev zlib1g-dev libmaxminddb-dev build-essential

      - name: Download nginx source
        run: |
          wget http://nginx.org/download/nginx-1.18.0.tar.gz
          tar -xzf nginx-1.18.0.tar.gz

      - name: Download OpenSSL 3.5 source
        run: |
          wget https://github.com/openssl/openssl/releases/download/openssl-3.5.0/openssl-3.5.0.tar.gz
          tar -xzf openssl-3.5.0.tar.gz

      - name: Clone geoip2 module
        run: git clone https://github.com/leev/ngx_http_geoip2_module.git

      - name: Configure nginx
        working-directory: nginx-1.18.0
        run: |
          ./configure --prefix=/usr/share/nginx --conf-path=/etc/nginx/nginx.conf --sbin-path=/usr/sbin/nginx --http-log-path=/var/log/nginx/access.log --error-log-path=/var/log/nginx/error.log --lock-path=/var/lock/nginx.lock --pid-path=/run/nginx.pid --modules-path=/usr/lib/nginx/modules --http-client-body-temp-path=/var/lib/nginx/body --http-fastcgi-temp-path=/var/lib/nginx/fastcgi --http-proxy-temp-path=/var/lib/nginx/proxy --http-scgi-temp-path=/var/lib/nginx/scgi --http-uwsgi-temp-path=/var/lib/nginx/uwsgi --with-compat --with-pcre-jit --with-http_ssl_module --with-http_stub_status_module --with-http_realip_module --with-http_auth_request_module --with-http_v2_module --with-http_dav_module --with-http_slice_module --with-threads --with-http_addition_module --with-http_gunzip_module --with-http_gzip_static_module --with-http_sub_module --add-dynamic-module=../ngx_http_geoip2_module --with-openssl=../openssl-3.5.0

      - name: Build nginx
        working-directory: nginx-1.18.0
        run: make -j$(nproc)

      - name: Upload nginx binary
        uses: actions/upload-artifact@v4
        with:
          name: nginx-binary
          path: nginx-1.18.0/objs/nginx

      - name: Upload geoip2 module
        uses: actions/upload-artifact@v4
        with:
          name: geoip2-modules
          path: nginx-1.18.0/objs/*.so
